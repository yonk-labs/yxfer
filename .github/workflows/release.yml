name: Build installers

# Push a tag to cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get installers without tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; the release job raises its own to contents: write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing should still leave the others downloadable.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifacts: 'release/*.dmg'
          - os: windows-latest
            platform: win
            artifacts: 'release/*.exe'
          - os: ubuntu-latest
            platform: linux
            artifacts: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # The suites drive a real Electron main process, so Linux needs a display.
        run: ${{ matrix.os == 'ubuntu-latest' && 'xvfb-run --auto-servernum npm test' || 'npm test' }}

      - name: Build installers
        run: node scripts/build-installers.mjs ${{ matrix.platform }}
        env:
          # Populate these repository secrets to ship signed builds.
          # Unset, the build still succeeds and produces unsigned installers.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: yxfer-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    # Only publish a GitHub Release for tag pushes, not manual runs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
